name: SCAH Security Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    uses: SCAH-club/scah-security/.github/workflows/semgrep.yml@main

  developer-security-report:
    uses: SCAH-club/scah-security/.github/workflows/developer-security-report.yml@main
    with:
      node-version: "22"
      working-directory: "."
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
